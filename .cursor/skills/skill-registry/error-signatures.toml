# PLAN-047g：错误签名 → SK-ID 路由表
# 字段：id, skill, pattern, symptom, first_check, fix, verify

[[signature]]
id = "SIG-UNABLE-EXPORT"
skill = "SK-Q005"
pattern = "Unable to export paragraphs that have not yet been formatted"
symptom = "译文整段消失/摘要丢了"
first_check = "journalctl Unable to export；optimal_scale vs min_scale"
fix = "不折 fit；min_scale=0.12；047c no-drop"
verify = "Unable to export == 0 且输出含摘要/目的"

[[signature]]
id = "SIG-NO-LOCAL-OCR"
skill = "SK-Q004"
pattern = "no local rapidocr, routing image translate to sidecar"
symptom = "改了嵌字没效果"
first_check = "sidecar ActiveEnterTimestamp vs image_translate.py mtime"
fix = "deploy-translate-stack.sh"
verify = "双侧指纹一致"

[[signature]]
id = "SIG-QC-EMPTY"
skill = "SK-Q004"
pattern = "object_qc.: .[].*|QC_CHANNEL_BLIND"
symptom = "QC 没告警/缺陷没被发现"
first_check = "imgtr.json qc_channel 与 object_qc"
fix = "X-Image-QC 响应头"
verify = "qc_channel=sidecar 且 object_qc 非空率>0"

[[signature]]
id = "SIG-TABLE-QC-HARD"
skill = "SK-Q003"
pattern = "TABLE_QC_HARD"
symptom = "表格乱套/字体不统一"
first_check = "有无 .tbltr.pdf；门禁 reason"
fix = "pdf_table_normalize；literature OVERFLOW 软化"
verify = "表区字号种类≤3"

[[signature]]
id = "SIG-COLUMN-CLUSTER"
skill = "SK-Q003"
pattern = "COLUMN_CLUSTER_DRIFT"
symptom = "表格括号缺失/列错位"
first_check = "碎片格与列跨度是否同时命中"
fix = "047e 须 fragments≥2 且 sparse×2.0"
verify = "三线表不再误杀"

[[signature]]
id = "SIG-FALLBACK-TRANSLATION"
skill = "SK-Q007"
pattern = "Fallback to simple translation"
symptom = "漏翻译/译文里有英文/药名不对"
first_check = "Successful/Fallback 计数"
fix = "sanitize 强制口径 + Fallback 重译"
verify = "每周两次/特罗金/发现gs 计数=0"

[[signature]]
id = "SIG-LIT-OVERFLOW"
skill = "SK-Q005"
pattern = "literature typeset overflow"
symptom = "摘要排版告警暴增"
first_check = "overflow 容差是否 0.5×字号"
fix = "doc_profile _layout_clip 容差"
verify = "overflow 警告个位数"

[[signature]]
id = "SIG-SIZE-CHANGED-OVERLAY"
skill = "SK-Q002"
pattern = "size changed .* use overlay"
symptom = "图内文字小/背景清理不干净"
first_check = "sidecar 是否加载新代码；竖排是否聚合"
fix = "047f 竖排聚合+字号下限+擦除覆盖率"
verify = "竖排旋转数≥1；无 QC_GRAPHICS_DAMAGE"

[[signature]]
id = "SIG-TABLE-SCRAMBLE"
skill = "SK-Q009"
pattern = "GEOMETRY_CENTER_UNSAFE|table writeback failed.*COLUMN_CLUSTER"
symptom = "表格崩了/串格/列并了"
first_check = "grid_source；是否 geometry_center 仍落笔"
fix = "HPD 网格+assert_grid_source_safe；删 _merge_column_clusters"
verify = "grid_source=hpd|gutter；nAb 与浓度分列"

[[signature]]
id = "SIG-NOT-A-TABLE"
skill = "SK-Q009"
pattern = "NOT_A_TABLE|not_a_table"
symptom = "图被当成表/图注被涂改"
first_check = "HPD 是否吐 <table>；区域单元是否图注"
fix = "跳结构链交图片链"
verify = "该区无 .tbltr 涂改"

[[signature]]
id = "SIG-HPD-UNREACHABLE"
skill = "SK-Q009"
pattern = "hpd grid.*unreachable|error.: .unreachable"
symptom = "表格结构退化/全走 normalize"
first_check = "curl HPD /health；QYUNSLATION_HPD_BASE_URL"
fix = "恢复泰州 HPD 或 QYUNSLATION_HPD_GRID=gutter"
verify = "health ok 且缓存命中"

[[signature]]
id = "SIG-ADA7-HEADER-WRAP"
skill = "SK-Q009"
pattern = "剂量重复|伴ADA访视的EASI|Visit with ADA|header_texts_from_merged"
symptom = "数据已分开但表头没分开/剂量重复/末列不是伴ADA访视的EASI"
first_check = "origin 表头是否两行；是否每行重写 header_slots；with ADA 是否 skip 后访视列空"
fix = "merge_origin_header_cells + 每槽一次；七槽末列=伴ADA访视的EASI"
verify = "texts.count(剂量)==1 且 texts[1]==访视 且 texts[6]==伴ADA访视的EASI"

[[signature]]
id = "SIG-RULE-STUB-DROPPED"
skill = "SK-Q009"
pattern = "第一列格线|格线不贯穿|表2格线不完整|MIN_LINE_WIDTH_FRAC"
symptom = "表3第一列无线/表2右栏%列无线"
first_check = "原文 raw 分段是否先被页宽10%滤掉再合并；table_rule_lines 是否按 bbox 截 x"
fix = "短段先收再并；restore 用完整 x"
verify = "表3线x0<=68 且 表2线x1>=280"

[[signature]]
id = "SIG-BAR-DATA-MERGE"
skill = "SK-Q002"
pattern = "77.8.*14/18|65.538/58|柱上.*Q2W|_group_vertical_runs"
symptom = "柱顶数字/n/N被连到柱上/图上出现77.814/18"
first_check = "竖排聚合成员是否含 is_isolated_data_mark；合并文本是否含 数字+n/N"
fix = "数据标记不进 _group_vertical_runs、不送译"
verify = "合并文本不含 65.538/58 且 14/18 原位保留"

[[signature]]
id = "SIG-CAPTION-C5-SKIP"
skill = "SK-Q002"
pattern = "C5_SKIPPED|图5只译纵轴|题注没译|示意图没译|ERASE_COVER_MIN"
symptom = "图1/示意图/题注/横轴仍是英文"
first_check = "题注是否 must_draw；cover<70% 是否跳过；SOURCE_INK_LEFT 是否整图熔断"
fix = "题注整带擦+必画；残留只丢该框"
verify = "图1有中文题注；图5横轴有中文；柱上无拼接数字"

[[signature]]
id = "SIG-TERM-SEED-EMPTY"
skill = "SK-Q008"
pattern = "concepts total: 2|MATCH_WINDOW|未可靠对齐|window_cjk"
symptom = "实际/推荐译法全是占位或乱猜；EASI 仍在待确认"
first_check = "Concept 库 curated 计数；plan034d-import-csv.py 是否跑过"
fix = "导入 curated CSV，删除窗口启发式，已入库词写 applied/violation"
verify = "curated_concepts>=350 且待确认无已入库词"

[[signature]]
id = "SIG-TERM-SAVE-SWALLOWED"
skill = "SK-Q011"
pattern = "请先填写确认译法|保存后输入清空|status still pending"
symptom = "保存后输入清空、状态仍 pending"
first_check = "_qy060_table_confirmation 返回值；chosen_target 是否优先 table 输入"
fix = "空单元格返回 None；chosen_target = table_target or target"
verify = "填写确认译法后保存成功且状态变为 approved"

[[signature]]
id = "SIG-TERM-COLUMNS-EMPTY"
skill = "SK-Q011"
pattern = "需人工填写|未可靠对齐|暂无 AI 推荐"
symptom = "实际/推荐译法全是占位"
first_check = "Concept 库是否已 seed；align_observed 命中层级；QYUNSLATION_TERM_SUGGEST"
fix = "导入 curated；段落对齐；建议列不得预填窗口猜测"
verify = "实际译法有值或明确「需人工填写」，推荐列不编造"

[[signature]]
id = "SIG-TERM-CANDIDATE-NOISE"
skill = "SK-Q011"
pattern = "300 mg|Q2W|University|TSARTAI|14/18"
symptom = "300 mg / n/N / 两字母缩写 / OCR 乱码进候选"
first_check = "should_exclude_from_termbase 与 rules_version"
fix = "复用 classify_cell_policy；denylist / term-exclusions.csv"
verify = "待确认无剂量、比率、机构碎片"

[[signature]]
id = "SIG-TERM-SCREEN-BLIND"
skill = "SK-Q011"
pattern = "SCREEN_GENERIC|screen_origin|SCREEN_BLIND|screen cap"
symptom = "候选突然很少 / 缩写一个都没进待确认"
first_check = "screen_generic_ratio、origin=error|cap、provider、QYUNSLATION_TERM_SCREEN"
fix = "恢复 provider；勿把 SCREEN_GENERIC 高当成干净"
verify = "screen_error_count=0 且领域缩写能进 screen 池"

[[signature]]
id = "SIG-GUI-PATCH-STALE"
skill = "SK-Q011"
pattern = "already patched|_qy_tbl_progress|0.96 \\+ 0.03"
symptom = "补丁脚本打印 already patched 但现场行为是旧的"
first_check = "现场 gui.py 是否含仓库补丁标记清单"
fix = "upgrade_post_if_stale 按缺标记重打；deploy-translate-stack.sh"
verify = "现场含 _qy_tbl_progress 与 需人工填写 / 术语未遵循"

[[signature]]
id = "SIG-RULES-VERSION-DRIFT"
skill = "SK-Q011"
pattern = "062-v1|rules_version|fingerprint mismatch"
symptom = "规则明显改了但台账曲线没断点"
first_check = "term-candidate-rules.toml 内容哈希 vs term-rules-versions.md"
fix = "--promote 必须 bump version 并登记 fingerprint"
verify = "当前 fingerprint 出现在 versions 表且与 version 同行"

[[signature]]
id = "SIG-PRESERVE-WHOLE-PARAGRAPH"
skill = "SK-Q005"
pattern = "_QY_033H_PRESERVE|paragraph_is_preserved|skipped:preserve"
symptom = "编号问题段、背景段整段仍是英文，日志里没有 Fallback 也没有报错"
first_check = "用 scripts/qa/plan080_trace_run.py 重跑并用 plan080_trace_report.py 看该段 fate 是否 skipped:preserve；直接调用 paragraph_is_preserved(段落文字)"
fix = "编号条目（n. / n xxx）只在参考文献区内保留；机构/作者判定对长正文句（>30 词、含功能词或动词）不生效；见 PLAN-080a"
verify = "追踪报告中无非名单类 skipped:preserve；verify-plan-080.sh 的 preserve policy 一行 PASS"

[[signature]]
id = "SIG-UNTRANSLATED-PARAGRAPH"
skill = "SK-Q007"
pattern = "UNTRANSLATED_PARAGRAPH"
symptom = "全文英文占比很低，但个别整段没译"
first_check = "QA 条目 UNTRANSLATED_PARAGRAPH 的页锚点；plan080_diagnose.py 的 kept_non_title_blocks"
fix = "先查保留谓词（SIG-PRESERVE-WHOLE-PARAGRAPH），再查模型是否原样返回（追踪 fate=unchanged/fallback_unchanged）"
verify = "QYUNSLATION_LAYOUT_QA=on 重检后该码消失；有名有据的保留（人名、职务、机构、网址、参考文献）不被标记"

[[signature]]
id = "SIG-FONT-SPRAWL"
skill = "SK-Q003"
pattern = "FONT_FAMILY_SPRAWL|LXGWWenKai|NotoSerif-Italic"
symptom = "译文字体前后不一致（宋体、楷体、衬线斜体混用）"
first_check = "FontMapper 的字体表：lang_out=zh 时多语种字体族被合并，斜体走 script 字体"
fix = "QYUNSLATION_FONT_POLICY=unified（apply-pdf2zh-080c-fonts.py 已装入引擎）；被保留的原文不经 FontMapper，保持源字体"
verify = "plan080_diagnose.py 的 font_family_max_per_page 下降；FONT_FAMILY_SPRAWL 消失"

[[signature]]
id = "SIG-DECORATION-DANGLING"
skill = "SK-Q003"
pattern = "DECORATION_DANGLING"
symptom = "下划线比译文文字长、悬在空白处或压在别的文字下"
first_check = "BabelDOC 只重写文字，不重写矢量图形；plan_page 给出每条线的处理"
fix = "QYUNSLATION_DECORATION_REALIGN=on（runner 在 CLI 成功后处理 mono 与 dual）；擦除用 REMOVE_IF_TOUCHED 且只允许碰到线自身"
verify = "plan080_diagnose.py 的 underline_out_over_limit_cjk=0 且 underline_out_orphan 不高于源文"
