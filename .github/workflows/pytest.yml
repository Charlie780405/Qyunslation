name: pytest

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install project (no docling for CI speed)
        run: uv sync --frozen --extra mcp
      - name: Run pytest
        run: uv run pytest -q --cov=qyunslation --cov-report=term-missing -x
        env:
          DOCUTRANSLATE_BASE_URL: https://api.openai.com/v1
          DOCUTRANSLATE_API_KEY: test-api-key
          DOCUTRANSLATE_MODEL_ID: gpt-4o
          DOCUTRANSLATE_PROXY_ENABLED: "false"
          DOCUTRANSLATE_CONVERT_ENGINE: identity
